<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>サウンド校正アシスト</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <header>
    <h1>サウンド校正アシスト</h1>
    <p class="lead">スペルミス・文法エラーを音と読み上げで知らせます。</p>
  </header>

  <!-- スクリーンリーダー向けの通知領域。設定でオフにできる。 -->
  <div id="live" role="status" aria-live="assertive" aria-atomic="true" class="live"></div>

  <section class="panel" aria-labelledby="h-control">
    <h2 id="h-control">操作</h2>
    <div class="row">
      <button id="btn-unlock" type="button" accesskey="s">サウンドを有効化</button>
      <button id="btn-toggle" type="button" accesskey="m" aria-pressed="false">監視を開始</button>
      <button id="btn-check" type="button" accesskey="c">今すぐチェック</button>
    </div>
    <div class="row">
      <button id="btn-prev" type="button" accesskey="p">前の誤りへ</button>
      <button id="btn-next" type="button" accesskey="n">次の誤りへ</button>
      <button id="btn-replace" type="button" accesskey="r">候補で置換</button>
      <button id="btn-test" type="button">テスト音</button>
    </div>
    <p id="status" class="status" aria-live="polite">準備中です。</p>
  </section>

  <section class="panel" aria-labelledby="h-errors">
    <h2 id="h-errors">誤りの一覧 <span id="error-count" class="count">0件</span></h2>
    <ul id="error-list" role="listbox" aria-labelledby="h-errors" tabindex="0" class="error-list"></ul>
    <p class="hint">上下キーで選択、Enter で本文の該当箇所へ移動します。</p>
  </section>

  <details class="panel" id="settings-panel">
    <summary><h2>設定</h2></summary>

    <fieldset>
      <legend>検出</legend>
      <label for="checker">チェッカー</label>
      <select id="checker" data-setting="checker">
        <option value="builtin">内蔵(オフライン、辞書とルール)</option>
        <option value="languagetool">LanguageTool(ネットワーク)</option>
        <option value="both">両方</option>
      </select>
      <label for="languageToolEndpoint">LanguageTool の URL</label>
      <input id="languageToolEndpoint" type="url" data-setting="languageToolEndpoint" />
      <label for="language">言語</label>
      <select id="language" data-setting="language">
        <option value="auto">自動判定</option>
        <option value="en-US">英語(米国)</option>
        <option value="en-GB">英語(英国)</option>
        <option value="ja-JP">日本語</option>
      </select>
      <label for="pollIntervalMs">監視間隔(ミリ秒)</label>
      <input id="pollIntervalMs" type="number" min="300" step="100" data-setting="pollIntervalMs" />
      <label><input type="checkbox" data-setting="deferWhileTyping" /> 入力中の語は区切りを打つまで通知しない</label>
      <label><input type="checkbox" data-setting="annotations" /> 本文に下線(注釈)を表示する</label>
    </fieldset>

    <fieldset>
      <legend>効果音</legend>
      <label><input type="checkbox" data-setting="soundEnabled" /> 効果音を鳴らす</label>
      <label for="soundPreset">音のプリセット</label>
      <select id="soundPreset" data-setting="soundPreset"></select>
      <label for="volume">音量</label>
      <input id="volume" type="range" min="0" max="1" step="0.05" data-setting="volume" />
      <label><input type="checkbox" data-setting="soundSpelling" /> スペルミスの音</label>
      <label><input type="checkbox" data-setting="soundGrammar" /> 文法エラーの音</label>
      <label><input type="checkbox" data-setting="soundStyle" /> 表記ゆれ・体裁の音</label>
      <label><input type="checkbox" data-setting="soundResolved" /> 修正されたときの確認音</label>
      <label><input type="checkbox" data-setting="stereoPan" /> 行内の位置を左右の定位で表現する</label>
      <label for="burstThreshold">まとめ音にする件数</label>
      <input id="burstThreshold" type="number" min="2" max="20" data-setting="burstThreshold" />
      <label for="minIntervalMs">通知の最小間隔(ミリ秒)</label>
      <input id="minIntervalMs" type="number" min="0" step="50" data-setting="minIntervalMs" />
    </fieldset>

    <fieldset>
      <legend>読み上げ</legend>
      <label for="speechMode">読み上げの内容</label>
      <select id="speechMode" data-setting="speechMode">
        <option value="none">読み上げない</option>
        <option value="type">種類のみ</option>
        <option value="word">種類と語</option>
        <option value="spell">種類と語と綴り</option>
      </select>
      <label for="speechRate">読み上げ速度</label>
      <input id="speechRate" type="range" min="0.5" max="2" step="0.1" data-setting="speechRate" />
      <label><input type="checkbox" data-setting="liveRegion" /> スクリーンリーダーにも通知する(ライブリージョン)</label>
    </fieldset>

    <fieldset>
      <legend>ユーザー辞書(内蔵チェッカー)</legend>
      <p class="hint">1 行に「誤り,正しい語」を書きます。英語は単語単位、日本語は部分一致で探します。</p>
      <textarea id="dictionary" rows="6" aria-label="ユーザー辞書"></textarea>
      <div class="row">
        <button id="btn-dict-apply" type="button">辞書を適用</button>
        <button id="btn-dict-sample" type="button">サンプルを読み込む</button>
      </div>
    </fieldset>
  </details>

  <details class="panel" id="eval-panel">
    <summary><h2>評価用ログ</h2></summary>
    <label for="participant">参加者 ID</label>
    <input id="participant" type="text" data-setting="participant" />
    <label for="condition">条件</label>
    <input id="condition" type="text" data-setting="condition" placeholder="例: A-earcon, B-speech, C-none" />
    <div class="row">
      <button id="btn-log-summary" type="button">集計を表示</button>
      <button id="btn-log-copy" type="button">CSV をコピー</button>
      <button id="btn-log-download" type="button">CSV を保存</button>
      <button id="btn-log-json" type="button">JSON を保存</button>
      <button id="btn-log-clear" type="button">ログを消去</button>
    </div>
    <pre id="log-output" class="log" aria-label="ログの出力" tabindex="0"></pre>
  </details>

  <footer>
    <p id="env" class="hint"></p>
  </footer>

  <script type="module" src="taskpane.js"></script>
</body>
</html>
